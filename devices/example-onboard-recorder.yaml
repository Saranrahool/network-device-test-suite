# Example baseline for a real mobile recorder on a lab network.
# Disabled by default. Set enabled: true and the host to a device you own or are
# authorized to test, then run:  pytest --profiles devices/example-onboard-recorder.yaml
name: example-onboard-recorder
host: 192.168.1.50
enabled: false

expected_services:
  - name: http-management
    port: 80
  - name: https-management
    port: 443
  - name: rtsp-video
    port: 554

forbidden_ports:
  21: FTP (unencrypted file transfer)
  23: Telnet (unencrypted remote shell)
  69: TFTP (firmware loading)
  2323: Telnet (alternate)

scan_ports:
  - 1-1024
  - 2323
  - 8000
  - 8080
  - 8443
  - 8554

health_url: http://192.168.1.50/api/health
rtsp_port: 554
min_firmware: "7.0.0"

performance:
  max_connect_ms: 20   # wired lab LAN
  max_http_ms: 500
  samples: 30
