# Baseline for the simulated onboard camera (simulator/device_sim.py).
# Ports are the real-world numbers offset by 18000 so no admin rights are needed.
name: simulated-camera
host: 127.0.0.1
enabled: true

expected_services:
  - name: http-management
    port: 18080
  - name: rtsp-video
    port: 18554

# Ports that must never be open on a production device.
forbidden_ports:
  18021: FTP (unencrypted file transfer)
  18022: SSH debug access
  18023: Telnet (unencrypted remote shell)
  18069: TFTP (firmware loading)

# Everything to scan. Any open port here that is not expected is flagged.
scan_ports:
  - 18000-18100
  - 18443
  - 18554
  - 18888

health_url: http://127.0.0.1:18080/api/health
rtsp_port: 18554
min_firmware: "4.2.0"

performance:
  max_connect_ms: 50
  max_http_ms: 300
  samples: 20
